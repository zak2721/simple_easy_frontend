server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx only inherits a parent block's `add_header` lines into a location
    # that defines none of its own — since every location below sets its own
    # Cache-Control, the security headers are repeated in each one rather
    # than declared once at the server level, where they would otherwise
    # silently disappear from every response (confirmed live before this
    # comment was added: they were missing entirely on the first pass).
    #
    # frame-ancestors replaces X-Frame-Options here: Telegram Web
    # (web.telegram.org) loads Mini Apps in a cross-origin iframe, which a
    # blanket X-Frame-Options: SAMEORIGIN would have blocked.
    #
    # Production Readiness Audit (Medium): this CSP previously set ONLY
    # frame-ancestors — no script-src/style-src/default-src at all — so it
    # provided zero XSS mitigation even though the app's own XSS surface was
    # separately confirmed clean (no dangerouslySetInnerHTML/innerHTML
    # anywhere in src/). Now a real second line of defense: script-src has no
    # 'unsafe-inline'/'unsafe-eval' carve-out (the one inline <script> that
    # needed it was moved into src/main.tsx as an ordinary module statement).
    # style-src allows 'unsafe-inline' only — inline style={{...}} is used in
    # a couple of components for runtime, per-operator theme colors that
    # can't be precompiled into static Tailwind classes; style injection is a
    # much smaller attack surface than script injection, so this is a
    # deliberate, narrow exception, not a blanket relaxation. connect-src
    # 'self' is correct because Caddy proxies the API under this same origin
    # in every documented production deployment (see DEPLOYMENT.md) — this
    # file is never used for local dev, where Vite serves the app directly.

    # Long-lived cache for Vite's content-hashed assets; index.html itself is
    # deliberately excluded below so a new deploy is picked up immediately.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org https://*.web.telegram.org https://telegram.org;" always;
        try_files $uri =404;
    }

    # SPA fallback — every route serves index.html (spec §5: all routes → index.html)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org https://*.web.telegram.org https://telegram.org;" always;
        try_files $uri $uri/ /index.html;
    }
}
